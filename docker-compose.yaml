services:
  bookshelfapp:
    build:
      context: ${PROJECT_ROOT}
      dockerfile: cmd/bookshelfapp/dockerfile
    container_name: bookshelf
    environment:
      - HTTP_ADDR=:8080
      - HTTP_SHUTDOWN_TIMEOUT=${HTTP_SHUTDOWN_TIMEOUT}
      - POSTGRES_HOST=bookshelfapp-postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_TIMEOUT=${POSTGRES_TIMEOUT}
      - LOGGER_LVL=${LOGGER_LVL}
      - TIME_ZONE=${TIME_ZONE}
      - STATS_MIN_RATINGS=${STATS_MIN_RATINGS}
      - AUTH_SESSION_TTL=${AUTH_SESSION_TTL}
      - AUTH_BCRYPT_COST=${AUTH_BCRYPT_COST}
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE}
      - LOGGER_FOLDER=/app/out/logs
      - METRICS_ADDR=${METRICS_ADDR}
    volumes:
      - ${PROJECT_ROOT}/out/logs:/app/out/logs
    ports:
      - "8080:8080"
    restart: always
    depends_on:
      - bookshelfapp-postgres

  bookshelfapp-postgres:
    image: postgres:18.6-bookworm
    container_name: bookshelfapp-env-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql
    restart: always

  bookshelfapp-postgres-migrate:
    image: migrate/migrate:v4.20.1
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations

  port-forwarder:
    image: alpine/socat:1.8.1.3
    container_name: bookshelfapp-postgres-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:bookshelfapp-postgres:5432
    ports:
      - "127.0.0.1:5432:5432"

  swagger:
    build:
      context: ${PROJECT_ROOT}
      dockerfile_inline: |
        FROM golang:1.27.1-alpine
        RUN apk add --no-cache git
        RUN go install github.com/swaggo/swag/cmd/swag@v1.16.6
        WORKDIR /code
        ENTRYPOINT ["swag"]
    volumes:
      - ${PROJECT_ROOT}:/code

  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: bookshelfapp-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ${PROJECT_ROOT}/deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${PROJECT_ROOT}/out/prometheus:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  grafana:
    image: grafana/grafana:13.2.3
    container_name: bookshelfapp-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ${PROJECT_ROOT}/deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ${PROJECT_ROOT}/deploy/grafana/dashboards:/etc/grafana/dashboards:ro
      - ${PROJECT_ROOT}/out/grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    restart: always
